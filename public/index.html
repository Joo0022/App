<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaultline · Private team chat</title>
<style>
:root{--bg:#0d0b1f;--panel:#17143a;--line:#2d2862;--pink:#ff4d8d;--violet:#7a5cff;--amber:#ffb84d;--mint:#3dffc0;--text:#f3f1ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);
background:radial-gradient(600px 400px at 10% 0%,rgba(255,77,141,.25),transparent),radial-gradient(700px 500px at 100% 100%,rgba(122,92,255,.3),transparent),var(--bg)}
.hide{display:none!important}
.card{max-width:400px;margin:7vh auto;padding:34px 30px;background:rgba(23,20,58,.8);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:800;letter-spacing:-.5px}
.logo .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 8px 24px rgba(255,77,141,.4)}
.logo svg{width:26px;height:26px}
p.sub{margin:10px 0 22px;opacity:.7}
input{width:100%;padding:14px 16px;margin:6px 0;border-radius:16px;border:1px solid var(--line);background:#0f0c2b;color:var(--text);font:inherit}
input::placeholder{color:#8f89c9}
input:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button{padding:13px 20px;border:0;border-radius:16px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pink),var(--violet))}
button:hover{filter:brightness(1.1)}
.card button{width:100%;margin-top:12px}
.err{color:#ff8fa8;min-height:22px;margin-top:8px;font-size:14px}
details{margin-top:18px;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--amber);font-weight:600}
#chat{max-width:780px;height:100vh;margin:0 auto;display:flex;flex-direction:column;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(23,20,58,.8);border:1px solid var(--line);border-radius:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand .ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet))}
.brand svg{width:18px;height:18px}
.pill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mint);background:rgba(61,255,192,.1);padding:5px 12px;border-radius:99px;margin-left:12px;font-weight:600}
.out{background:transparent;border:1px solid var(--line);padding:8px 16px;font-size:14px;color:var(--text)}
#log{flex:1;overflow-y:auto;padding:18px 4px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:flex-end;max-width:85%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;text-transform:uppercase}
.m{padding:10px 16px;border-radius:22px 22px 22px 6px;background:var(--panel);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere}
.row.me .m{border-radius:22px 22px 6px 22px;background:linear-gradient(135deg,var(--pink),var(--violet));border-color:transparent}
.m b{display:block;font-size:12px;color:var(--amber);letter-spacing:.3px}
.row.me .m b{display:none}
.m i{display:block;font-size:11px;opacity:.6;font-style:normal;margin-top:3px;text-align:right}
.m.bad{border-color:#ff8fa8;background:#2a1530}
form#send{display:flex;gap:10px;padding:12px;background:rgba(23,20,58,.8);border:1px solid var(--line);border-radius:99px}
form#send input{margin:0;border:0;background:transparent;padding:10px 14px}
form#send input:focus{outline:none}
form#send button{width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center}
form#send svg{width:22px;height:22px}
</style></head><body>
<main class="card" id="login">
  <div class="logo"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>Vaultline</div>
  <p class="sub">Private, encrypted chat for invited teammates only.</p>
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <input id="k" type="password" placeholder="Team passphrase (encrypts messages)">
  <button id="go">Unlock chat</button><div class="err" id="err"></div>
  <details><summary>Owner: add or remove a teammate</summary>
    <input id="ak" type="password" placeholder="Owner key">
    <input id="au" placeholder="Teammate username">
    <input id="ap" type="password" placeholder="Teammate password (10+ characters)">
    <button id="add">Add teammate</button><button id="del" style="background:#3a2a5e">Remove teammate</button><div class="err" id="aerr"></div>
  </details>
</main>
<section id="chat" class="hide">
  <header>
    <div style="display:flex;align-items:center">
      <div class="brand"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>Vaultline</div>
      <span class="pill">&#9679; End-to-end encrypted</span>
    </div>
    <button class="out" id="out">Sign out</button>
  </header>
  <div id="log"></div>
  <form id="send"><input id="t" placeholder="Write a message..." autocomplete="off" maxlength="1000"><button aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
</section>
<script src="app.js"></script>
</body></html>
